<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Card Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Internal Grid Glow Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="8" stroke-dasharray="16 12" />

  <!-- Central CargoTracker Lightning Bolt Signal Icon -->
  <path d="M 280 96 L 152 272 L 248 272 L 232 416 L 360 240 L 264 240 Z" fill="#ffffff" stroke="url(#accentGrad)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" />
  
  <!-- Shipping Compass Dot Indicator -->
  <circle cx="360" cy="152" r="28" fill="#38bdf8" stroke="#ffffff" stroke-width="6" />
</svg>
